<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuujin chat studies</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee7d6;color:#30243c;font:16px/1.5 system-ui}header{padding:24px 32px;border-bottom:1px solid #30243c25}header p{font-size:13px;margin:4px 0}main{max-width:760px;margin:64px auto;padding:0 24px 120px}h1{font:48px/1.1 Georgia;margin:0 0 32px}.chat{padding:24px;border-radius:20px;background:#292231;color:#f4eadb}.meta{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff25;padding-bottom:20px;font-size:14px}.chat p{max-width:80%;padding:12px 16px;background:#ffffff0b;border:1px solid #ffffff20;border-radius:12px}.chat .mine{margin-left:auto;background:#dce1a3;color:#30243c}.meter{margin-top:32px;border-top:3px solid #dce1a3;padding-top:12px;font-size:12px}.postcard{background:#faf6ed;color:#30243c;border:1px solid #30243c25;border-radius:0}.postcard .meta{border-color:#30243c25}.postcard p{background:transparent;border:0;border-left:2px solid #30243c30;border-radius:0}.postcard .mine{background:#e9e2ed}.postcard .meter{border-color:#645079}.margin{display:grid;grid-template-columns:100px 1fr;gap:24px}.margin aside{border-top:1px solid #30243c;padding-top:12px;font-size:13px}.margin .chat{border-radius:8px}.data{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}.data button{padding:8px 12px;background:transparent;border:1px solid #30243c50;border-radius:8px;font:inherit;cursor:pointer}.data button[aria-pressed=true]{background:#30243c;color:#fffaf0}.chat p{overflow-wrap:anywhere}.meta strong{min-width:0;overflow-wrap:anywhere}@media(max-width:480px){.margin{grid-template-columns:1fr}.margin aside{display:none}main{margin-top:32px}.chat{padding:16px}h1{font-size:36px}} 
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}</style><header>Yuujin Circle <p>Design studies · sample data only · no account connection</p></header><main><h1>The first conversation</h1><div class="data" aria-label="Sample data"><button aria-pressed="true">Demo data</button><button aria-pressed="false">Worst case</button><button aria-pressed="false">Empty</button></div><div id="stage"></div></main>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Ink</button><button class="proto-picker-item">Postcard</button><button class="proto-picker-item">Margin</button></nav>
<script>
let dataMode=0;
function conversation(cls=''){return '<section class="chat '+cls+'"><div class="meta"><strong>'+(dataMode===1?'Christopher Alexander Montgomery III':'Mystery classmate')+'</strong><span>Stage 1 of 5</span></div>'+(dataMode===2?'<p>Say hello to your classmate</p>':'<p>Which campus spot would you take a friend to?</p><p class="mine">'+(dataMode===1?'AReallyLongUnbrokenMessage'.repeat(18):'The canteen after the last class. You?')+'</p><p>Same. See you after lectures?</p>')+'<div class="meter">3 / 38 messages · Interests revealed</div></section>'}
const variants=[()=>conversation(),()=>conversation('postcard'),()=>'<div class="margin"><aside>Conversation<br><br>Interests<br>Photo<br>Name<br>Course</aside>'+conversation()+'</div>'];
document.querySelectorAll('.data button').forEach((b,i)=>b.onclick=()=>{dataMode=i;document.querySelectorAll('.data button').forEach((x,j)=>x.setAttribute('aria-pressed',String(i===j)));mount(current)});
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));</script></html>
